name: Build VCam

on:
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Extract Sources
      run: |
        unzip vcam_controller_app.zip -d vcam_controller_app
        unzip magisk_module.zip -d magisk_module

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Build APK
      run: |
        cd vcam_controller_app
        gradle assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk ../vcam_controller_built.apk
        cd ..

    - name: Set up NDK
      run: |
        echo "y" | $ANDROID_HOME/tools/bin/sdkmanager --install 'ndk;25.1.8937393'
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

    - name: Build Zygisk SO
      run: |
        cd magisk_module/zygisk
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_PLATFORM=android-24
        cp libs/armeabi-v7a/zygisk_vcam.so ../zygisk/
        cd ..
        zip -r ../magisk_module_built.zip .

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: vcam_controller_built
        path: vcam_controller_built.apk

    - name: Upload Magisk Module
      uses: actions/upload-artifact@v4
      with:
        name: magisk_module_built
        path: magisk_module_built.zip
